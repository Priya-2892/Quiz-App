<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
     <!-- bootstrap-css-cdn-link -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
     rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
     crossorigin="anonymous">
 
     <!-- font-stylesheet-link -->
     <link rel="stylesheet" href="./assets/fonts/poppins/stylesheet.css">
 
     <!-- css-link -->
     <link rel="stylesheet" href="./assets/style.css">

</head>
<body>  
    <section>
        <div class="container">
            <h1 id="quiz-head"> <span class="first-letter">Q</span>uiz <span class="first-letter">G</span>ame</h1>
            <form action="index.html" method="post" class="form-api">
                <h2 class="form-heading">Select Your Choice:-</h2>
        
                <label for="trivia_amount" id="amount">Number of Questions:</label>
                <input type="number" name="trivia_amount" id="amount" class="form-control" min="1" max="50" value="0" onchange="storeValue(event)">
                <br>
        
                <label for="trivia_category">Select Category: </label>
                <select name="trivia_category" class="form-control" id="category" onchange="storeValue(event)" required>
                    <option value="">Any Category</option>
                    <option value="9">General Knowledge</option>
                    <option value="10">Entertainment: Books</option>
                    <option value="11">Entertainment: Film</option>
                    <option value="12">Entertainment: Music</option>
                    <option value="13">Entertainment: Musicals &amp; Theatres</option>
                    <option value="14">Entertainment: Television</option>
                    <option value="15">Entertainment: Video Games</option>
                    <option value="16">Entertainment: Board Games</option>
                    <option value="17">Science &amp; Nature</option>
                    <option value="18">Science: Computers</option>
                    <option value="19">Science: Mathematics</option>
                    <option value="20">Mythology</option>
                    <option value="21">Sports</option>
                    <option value="22">Geography</option>
                    <option value="23">History</option>
                    <option value="24">Politics</option>
                    <option value="25">Art</option>
                    <option value="26">Celebrities</option>
                    <option value="27">Animals</option>
                    <option value="28">Vehicles</option>
                    <option value="29">Entertainment: Comics</option>
                    <option value="30">Science: Gadgets</option>
                    <option value="31">Entertainment: Japanese Anime &amp; Manga</option>
                    <option value="32">Entertainment: Cartoon &amp; Animations</option>
                </select>
                <br>
        
                <label for="trivia_difficulty">Select Difficulty: </label>
                <select name="trivia_difficulty" class="form-control" id="difficulty" onchange="storeValue(event)" required>
                    <option value="">Any</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
                <br>
        
                <label for="trivia_type">Select Type: </label>
                <select name="trivia_type" class="form-control" id="type" onchange="storeValue(event)" required>&gt;
                    <option value="">Any Type</option>
                    <option value="multiple">Multiple Choice</option>
                    <option value="boolean">True / False</option>
                </select>
                <br>
        
                <button class="btn btn-lg btn-block" type="submit">Start Quiz</button>
            </form>
        </div>
    </section>	
    
    <script>
function storeValue(event){
    console.log(event.target.value);
    sessionStorage.setItem(event.target.id, event.target.value);
}

    </script>
 
    <!-- <script src="./assets/script.js"></script> -->
</body>
</html>
